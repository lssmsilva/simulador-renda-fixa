name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia, 08:00 em Brasilia (11:00 UTC)
  workflow_dispatch:        # permite rodar na mao pelo botao "Run workflow"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes (se falhar, nada e publicado)
        run: python -m pytest -q
      - name: Coletar dados oficiais (Banco Central e Tesouro)
        run: python src/coletar.py
      - name: Gerar a pagina
        run: python src/gerar_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
